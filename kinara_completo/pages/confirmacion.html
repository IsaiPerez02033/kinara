<!DOCTYPE html>
<!--
  confirmacion.html — Página de confirmación de pedido
  El cliente llega aquí después de pagar en Mercado Pago.
  Mercado Pago envía el resultado del pago en los parámetros
  de la URL (?status=success/failure/pending&pedido=UUID).
  Leo esos parámetros, consulto el pedido en Supabase y
  muestro el mensaje apropiado al cliente.
-->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- No indexo esta página -->
  <meta name="robots" content="noindex" />
  <title>Confirmación de pedido — Kinara</title>

  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png" />
  <meta name="theme-color" content="#f3f2ee" />
  <meta property="og:site_name" content="Kinara" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_MX" />
  <meta property="og:title" content="Confirmación de pedido — Kinara" />
  <meta property="og:description" content="Impresión 3D en México: lámparas, herramientas, moldes, juguetes, figuras y piezas personalizadas." />
  <meta property="og:image" content="https://kinaramx.com/assets/images/og-kinara.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://kinaramx.com/assets/images/og-kinara.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/carrito.css" />
  <link rel="stylesheet" href="../css/cuenta.css" />
  <link rel="stylesheet" href="../css/movimiento.css" />
  <!-- Chrome, Edge y Brave descargan la página antes del clic; Safari lo ignora -->
  <script type="speculationrules">{"prefetch":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"/pages/admin.html*"}},{"not":{"selector_matches":"[target=_blank]"}}]},"eagerness":"moderate"}]}</script>
</head>

<body class="pagina-simple">

  <header class="pagina-simple-header">
    <a href="../index.html" class="logo" aria-label="Kinara, volver al inicio">
      <img class="logo-marca" src="../assets/images/logo-kinara-marca.svg" alt="" width="32" height="32" />
      <span class="logo-nombre">KINARA</span>
    </a>
  </header>

  <!-- Contenido principal: se renderiza con JavaScript -->
  <main class="confirmacion-page">
    <div class="confirmacion-card" id="confirmacion-contenido">
      <div class="pago-estado" id="estado-cargando">
        <div class="pago-spinner"></div>
        <h1 class="pago-estado-titulo">Verificando tu pedido…</h1>
      </div>
    </div>
  </main>

  <footer class="pagina-simple-footer">© Kinara · Impresión 3D · México · <a href="envios.html" class="footer-legal">Envíos y devoluciones</a> · <a href="privacidad.html" class="footer-legal">Aviso de privacidad</a></footer>

  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
  <!-- Cliente Supabase de Kinara -->
  <script src="../js/movimiento.js"></script>
  <script src="../js/lib/supabase.js"></script>

  <script>
    'use strict';

    /**
     * Leo los parámetros de la URL que Mercado Pago envía
     * después de que el cliente completa (o falla) el pago.
     *
     * Mercado Pago envía estos parámetros:
     * - status: "approved" | "failure" | "pending"
     * - collection_status: estado del cobro
     * - payment_id: ID del pago en MP
     * - pedido: el external_reference que envié (UUID del pedido)
     */
    const params    = new URLSearchParams(window.location.search);
    const status    = params.get('status');
    const pedidoId  = params.get('pedido');
    
    /**
     * Formateo un precio en MXN.
     */
    const fmt = (n) => {
      const v = parseFloat(n);
      return v.toLocaleString('es-MX', { minimumFractionDigits: Number.isInteger(Math.round(v * 100) / 100) ? 0 : 2, maximumFractionDigits: 2 });
    };

    /**
     * Formateo una fecha de forma legible.
     */
    const fmtFecha = (f) =>
      new Date(f).toLocaleDateString('es-MX', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });

    /**
     * Renderizo el contenido de la página según el resultado del pago.
     * Consulto el pedido en Supabase para mostrar los detalles reales.
     */
    const renderizarConfirmacion = async () => {
      const contenedor = document.getElementById('confirmacion-contenido');

      // El estado real sale de la base de datos: el ?status= de la URL
      // se puede editar a mano y solo indica cómo volvió el cliente.
      let pedido = null;
      if (pedidoId) {
        const { data } = await SupabaseDB.cliente
          .rpc('obtener_resumen_pedido', { p_pedido_id: pedidoId });
        pedido = data?.[0] ?? null;
      }

      const pagado = ['pagado', 'en_produccion', 'enviado', 'entregado'].includes(pedido?.estado);

      // El pago ya se inició o concluyó: el carrito ya cumplió su función
      // Una cotización se paga sin tocar el carrito de la tienda
      let eraCotizacion = false;
      try { eraCotizacion = sessionStorage.getItem('kinara:pago_cotizacion') === pedidoId; } catch (_) {}
      if ((pagado || status === 'success' || status === 'pending') && !eraCotizacion) {
        localStorage.removeItem('kinara_carrito_v1');
        localStorage.removeItem('kinara_pedido_actual');
      }

      // Con cuenta: el pedido ya está en "Mis pedidos". Sin cuenta: la invito
      const { data: { session } } = await SupabaseDB.cliente.auth.getSession();
      const cuentaCTA = session
        ? `<p class="confirmacion-nota">Sigue el avance de este pedido en <a href="cuenta.html#pedidos">Mis pedidos</a>.</p>`
        : `<div class="confirmacion-cuenta">
             <p><strong>Sigue tu pedido desde tu cuenta.</strong> Crea una con el mismo correo de tu compra y este pedido aparecerá ahí.</p>
             <a href="acceso.html?modo=registro" class="btn-secundario btn-chico">Crear cuenta</a>
           </div>`;

      const numeroPedido = `<div class="confirmacion-id">Pedido #${escHTML(pedidoId?.substring(0,8).toUpperCase())}</div>`;

      // Caso: pago confirmado por el webhook
      if (pagado) {
        const items = typeof pedido.items === 'string' ? JSON.parse(pedido.items) : pedido.items || [];
        const descuento = Number(pedido.descuento || 0);
        const envio = pedido.envio != null
          ? Number(pedido.envio)
          : Number(pedido.total) - items.reduce((s, i) => s + Number(i.subtotal), 0);
        contenedor.innerHTML = `
          <div class="confirmacion-icono confirmacion-icono--exito">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <p class="confirmacion-etiqueta">Pago confirmado</p>
          <h1 class="confirmacion-titulo">Gracias por tu pedido</h1>
          <p class="confirmacion-subtitulo">
            ${pedido.cliente_nombre ? `Hola, ${escHTML(pedido.cliente_nombre)}.` : ''}
            Ya recibimos tu pedido en nuestro taller.
          </p>
          ${numeroPedido}
          <table class="pedido-tabla">
            <thead><tr><th>Producto</th><th>Total</th></tr></thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td>
                    <span class="pedido-item-nombre">${escHTML(item.nombre)}</span>
                    ${escHTML(item.coleccion)} × ${item.cantidad}
                  </td>
                  <td>$${fmt(item.subtotal)}</td>
                </tr>`).join('')}
              ${envio > 0.009 ? `<tr><td><span class="pedido-item-nombre">Envío a domicilio</span></td><td>$${fmt(envio)}</td></tr>` : ''}
              ${descuento > 0 ? `<tr><td><span class="pedido-item-nombre">Monedero Kinara</span></td><td>−$${fmt(descuento)}</td></tr>` : ''}
            </tbody>
          </table>
          <div class="pedido-total"><span>Total pagado</span><strong>$${fmt(pedido.total)} MXN</strong></div>
          ${Number(pedido.iva) > 0 ? `<p class="pedido-iva">Incluye IVA (${Math.round(Number(pedido.iva_tasa) * 100)}%): $${fmt(pedido.iva)}</p>` : ''}
          <p class="confirmacion-etiqueta">¿Qué sigue?</p>
          <ol class="pedido-pasos">
            <li><span>01</span>Guarda tu número de pedido para cualquier aclaración.</li>
            <li><span>02</span>Iniciamos la producción de tu pedido.</li>
            <li><span>03</span>Te avisamos cuando tu pieza esté lista para envío.</li>
          </ol>
          ${cuentaCTA}
          <div class="confirmacion-acciones">
            <a href="../index.html" class="btn-primario">Seguir explorando</a>
            <a href="mailto:hola@kinaramx.com" class="btn-secundario">Contactar a Kinara</a>
          </div>`;

      } else if (status === 'success' || status === 'pending') {
        // El webhook aún no confirma: nunca muestro "pagado" antes de tiempo
        contenedor.innerHTML = `
          <div class="confirmacion-icono confirmacion-icono--espera">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <p class="confirmacion-etiqueta">Pago en proceso</p>
          <h1 class="confirmacion-titulo">Tu pedido está pendiente</h1>
          <p class="confirmacion-subtitulo">
            Estamos esperando la confirmación de Mercado Pago. Puede tardar desde
            unos segundos hasta algunas horas, según el método de pago.
          </p>
          ${numeroPedido}
          <p class="confirmacion-nota">
            Actualiza esta página en unos minutos para ver la confirmación.
            Si elegiste OXXO, presenta tu ficha en cualquier tienda para completar el pago.
          </p>
          ${cuentaCTA}
          <div class="confirmacion-acciones">
            <a href="../index.html" class="btn-primario">Volver al inicio</a>
            <a href="mailto:hola@kinaramx.com" class="btn-secundario">¿Tienes dudas?</a>
          </div>`;

      } else {
        // Pago fallido o cancelado
        contenedor.innerHTML = `
          <div class="confirmacion-icono confirmacion-icono--error">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
          <p class="confirmacion-etiqueta">Pago no completado</p>
          <h1 class="confirmacion-titulo">No se completó el pago</h1>
          <p class="confirmacion-subtitulo">No se hizo ningún cargo confirmado a tu pedido. Puedes intentarlo con otro método de pago.</p>
          <p class="confirmacion-nota">Tus piezas siguen en el carrito. Si necesitas ayuda, escríbenos.</p>
          <div class="confirmacion-acciones">
            <a href="../index.html#catalogo" class="btn-primario">Volver al catálogo</a>
            <a href="mailto:hola@kinaramx.com" class="btn-secundario">Pedir ayuda</a>
          </div>`;
      }
    };

    // Inicio la renderización cuando el DOM está listo
    document.addEventListener('DOMContentLoaded', renderizarConfirmacion);
  </script>
</body>
</html>
